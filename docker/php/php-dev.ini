; Surcouche de developpement, chargee apres `keneya.ini` (les fichiers de
; conf.d se lisent dans l'ordre alphabetique, et celui-ci est monte sous le
; nom `zz-keneya-dev.ini`).
;
; ---------------------------------------------------------------------------
; Le probleme
; ---------------------------------------------------------------------------
;
; `docker/php/php.ini` pose `opcache.validate_timestamps = 0`, ce qui est le
; bon reglage en service : PHP ne verifie plus la date des fichiers a chaque
; requete. Sur un poste de developpement, ce meme reglage transforme le
; montage du code en piege silencieux : on modifie un gabarit Blade ou une
; classe, on recharge la page, et l'ancienne version s'affiche. `artisan
; view:clear` n'y change rien — le fichier compile est bien supprime et
; recree, mais sous le meme nom, et opcache continue de servir l'opcode qu'il
; garde pour ce chemin. La seule issue etait de redemarrer le conteneur, ce
; que rien n'indiquait.
;
; ---------------------------------------------------------------------------
; Pourquoi pas simplement « validate_timestamps = 1 »
; ---------------------------------------------------------------------------
;
; Parce que le code est monte depuis l'hote, et que sur Docker Desktop chaque
; appel systeme traverse un pont. Revalider veut dire interroger la date des
; 8 700 fichiers PHP de `vendor/` a chaque requete. Mesure sur la page de
; connexion, requetes chaudes :
;
;     validate_timestamps = 0                    0,26 - 0,47 s
;     validate_timestamps = 1, freq = 2          3,4  - 5,6  s
;     idem + realpath_cache a 32 Mo              3,0  - 6,9  s
;
; Un facteur dix, qu'aucun reglage de cache ne rattrape : c'est le montage qui
; coute, pas PHP.
;
; ---------------------------------------------------------------------------
; Ce qui est fait a la place
; ---------------------------------------------------------------------------
;
; Le cache reste en place, sans revalidation, pour tout ce qui ne change
; jamais pendant une session de travail — c'est-a-dire `vendor/`, l'ecrasante
; majorite des fichiers. Le code du projet, lui, est exclu du cache par
; `opcache-dev-exclusions.txt` : quelques centaines de fichiers recompiles a
; chaque requete, ce qui se paie en dixiemes de seconde et non en secondes.
;
;     exclusions du projet                       0,55 - 0,85 s
;
; Resultat : une modification de gabarit ou de classe est visible au
; rechargement de la page, sans commande ni redemarrage, et la page reste
; six fois plus rapide qu'avec une revalidation generale.
;
; Une modification dans `vendor/` — donc un `composer install` — reste
; invisible tant que php-fpm n'a pas recharge :
;
;     docker compose exec app kill -USR2 1
;
; Ce fichier est monte par `docker-compose.yml`, qui est le fichier de la pile
; de developpement : un deploiement en service ne l'utilise pas et garde donc
; le cache complet.
opcache.validate_timestamps = 0
opcache.blacklist_filename = /usr/local/etc/php/conf.d/opcache-dev-exclusions.txt
