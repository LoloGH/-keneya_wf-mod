; Surcouche de developpement, chargee apres `keneya.ini` (les fichiers de
; conf.d se lisent dans l'ordre alphabetique, et celui-ci est monte sous le
; nom `zz-keneya-dev.ini`).
;
; Pourquoi elle existe. `docker/php/php.ini` pose
; `opcache.validate_timestamps = 0`, ce qui est le bon reglage en service :
; PHP ne verifie plus la date des fichiers a chaque requete, et gagne
; sensiblement en vitesse.
;
; Sur un poste de developpement, ce meme reglage transforme le montage du
; code en piege silencieux : on modifie un gabarit Blade ou une classe, on
; recharge la page, et le navigateur affiche l'ancienne version. `artisan
; view:clear` n'y change rien — le fichier compile est bien supprime et
; recree, mais opcache continue de servir l'opcode qu'il garde pour ce
; chemin. La seule issue est de redemarrer le conteneur, ce que rien
; n'indique.
;
; Elle est montee par `docker-compose.yml`, qui est le fichier de la pile de
; developpement : un deploiement en service n'utilise pas ce compose et garde
; donc le reglage rapide.
opcache.validate_timestamps = 1

; Zero plutot que la valeur par defaut de 2 secondes : deux secondes suffisent
; a faire douter d'une modification qui vient d'etre enregistree.
opcache.revalidate_freq = 0
