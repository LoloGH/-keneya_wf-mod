; Reglages PHP de KEneYa WorkFlow.
memory_limit = 256M
; Les pieces jointes sont plafonnees a 10 Mo cote application
; (App\Models\Attachment::MAX_SIZE_KB) : ces limites doivent rester au-dessus,
; sinon un fichier accepte par le formulaire serait rejete par PHP.
upload_max_filesize = 12M
post_max_size = 16M
max_execution_time = 60
date.timezone = Africa/Bamako

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
