# Nginx pour KEneYa WorkFlow. Identique sous Linux et sous Windows/WSL2.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    # Doit rester au-dessus du plafond applicatif des pieces jointes (10 Mo),
    # sinon Nginx rejetterait l'envoi avant meme d'atteindre PHP.
    client_max_body_size 16M;

    # Livewire fait beaucoup de petites requetes : on evite de journaliser
    # les fichiers statiques pour garder des journaux lisibles.
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    # Aucun acces direct aux fichiers caches.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;
}
