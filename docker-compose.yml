# KEneYa WorkFlow + module DME — pile applicative d'assemblage.
#
# Ce fichier tourne a l'identique sous Docker Engine (Linux) et sous
# Docker Desktop / WSL2 (Windows) : aucun chemin absolu, aucun montage
# specifique a un systeme, aucune option reservee a Linux.
#
#   docker compose up -d --build
#
# Trois piles Keneya doivent pouvoir tourner en parallele sur le meme poste :
# `keneya_workflow` sur le port 8080, `keneya-dme_app` (module en autonome) sur
# le 8081, et cet assemblage sur le 8083. Tout ce qui est nomme globalement par
# Docker — images, volumes — porte donc ici un nom propre a l'assemblage : un
# volume `keneya_db` partage aurait fait ecrire cette pile dans la base de
# production de `keneya_workflow`, ce qui ne se voit qu'une fois le mal fait.
services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: keneya-wf-mod-app
    restart: unless-stopped
    working_dir: /var/www/html
    # Reconstruit les caches de demarrage de Laravel avant php-fpm : sans eux,
    # chaque requete relit `config/` et reconstruit la table des routes a
    # travers le montage, ce qui double le temps de reponse. Les reconstruire
    # ici plutot que par une commande a retenir evite le piege du cache
    # perime : un `docker compose restart app` suffit apres une modification
    # de `.env`, `config/`, `routes/` ou `vendor/`.
    entrypoint: ["/usr/local/bin/dev-entrypoint.sh"]
    command: ["php-fpm"]
    volumes:
      - ./docker/php/dev-entrypoint.sh:/usr/local/bin/dev-entrypoint.sh:ro
      - ./:/var/www/html
      - keneya_storage:/var/www/html/storage
      # Le module DME est reference en depot `path` dans composer.json. Sans
      # ce montage, `composer install` echouerait dans le conteneur alors
      # qu'il fonctionne sur l'hote : le chemin declare dans composer.json est
      # celui vu d'ici, pas celui de la machine.
      - ../keneya-dme_mod:/var/www/keneya-dme_mod:ro
      # Surcouche de developpement : les gabarits compiles sortent d'opcache,
      # sans quoi une modification de gabarit n'apparait qu'apres un
      # redemarrage du conteneur, sans que rien ne le signale. Le reste garde
      # le cache complet — revalider tout le montage couterait dix fois le
      # temps de reponse.
      - ./docker/php/php-dev.ini:/usr/local/etc/php/conf.d/zz-keneya-dev.ini:ro
      - ./docker/php/opcache-dev-exclusions.txt:/usr/local/etc/php/conf.d/opcache-dev-exclusions.txt:ro
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - keneya

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT:-8083}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - keneya

  # Premiere tache planifiee reelle de l'application (v3.2.3, point 2) : sans
  # ce service, les rappels de rendez-vous ne partiraient jamais et rien ne le
  # signalerait. Meme image et meme code que `app` — il ne sert pas de requetes
  # HTTP, il reveille le planificateur Laravel chaque minute.
  #
  # `schedule:work` plutot qu'un cron dans l'image : rien a installer ni a
  # superviser en plus, le conteneur redemarre avec la pile, et ses executions
  # se lisent dans `docker compose logs scheduler`.
  #
  # Le module DME y ajoute sa propre tache (`keneya:duty:sync`, toutes les
  # cinq minutes) : un seul `schedule:work` couvre l'hote et le module, il n'y
  # a pas de conteneur supplementaire a prevoir.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: keneya-wf-mod-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
      - keneya_storage:/var/www/html/storage
      - ../keneya-dme_mod:/var/www/keneya-dme_mod:ro
      # Surcouche de developpement : les gabarits compiles sortent d'opcache,
      # sans quoi une modification de gabarit n'apparait qu'apres un
      # redemarrage du conteneur, sans que rien ne le signale. Le reste garde
      # le cache complet — revalider tout le montage couterait dix fois le
      # temps de reponse.
      - ./docker/php/php-dev.ini:/usr/local/etc/php/conf.d/zz-keneya-dev.ini:ro
      - ./docker/php/opcache-dev-exclusions.txt:/usr/local/etc/php/conf.d/opcache-dev-exclusions.txt:ro
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - keneya

  # File d'attente des SMS (v3.2.8). Sans ce service, les jobs s'empilent dans
  # la table `jobs` et aucun SMS ne part — l'application, elle, continue de
  # fonctionner : c'est precisement le but de la mise en file.
  #
  # Conteneur distinct du `scheduler` plutot que reutilise : un worker qui
  # plante et redemarre ne doit ni interrompre les rappels de rendez-vous, ni
  # toucher au serveur web. Meme image, meme code, responsabilite separee.
  #
  # `--tries=3 --backoff=30,60,120` : trois tentatives espacees de 30 s, 60 s
  # puis 120 s. Le telephone Android qui heberge SMSGate peut sortir de veille
  # entre-temps ; au-dela, l'echec est consigne dans `sms_messages` et compte
  # dans l'indicateur de la section « SMS » de l'administration.
  #
  # Depuis l'assemblage, c'est aussi ce worker qui emet les SMS declenches
  # depuis le module : son contrat d'envoi est lie a `SendSmsJob`.
  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: keneya-wf-mod-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --backoff=30,60,120
    volumes:
      - ./:/var/www/html
      - keneya_storage:/var/www/html/storage
      - ../keneya-dme_mod:/var/www/keneya-dme_mod:ro
      # Surcouche de developpement : les gabarits compiles sortent d'opcache,
      # sans quoi une modification de gabarit n'apparait qu'apres un
      # redemarrage du conteneur, sans que rien ne le signale. Le reste garde
      # le cache complet — revalider tout le montage couterait dix fois le
      # temps de reponse.
      - ./docker/php/php-dev.ini:/usr/local/etc/php/conf.d/zz-keneya-dev.ini:ro
      - ./docker/php/opcache-dev-exclusions.txt:/usr/local/etc/php/conf.d/opcache-dev-exclusions.txt:ro
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - keneya

  # Outillage du module DME : ses tests, son formateur, son composer.
  #
  # Les trois services qui servent l'application montent `../keneya-dme_mod` en
  # lecture seule, et c'est voulu : une pile qui repond a des requetes HTTP n'a
  # aucune raison de pouvoir reecrire le code d'un de ses paquets. Mais le
  # module reste un depot de travail, dont la suite de tests doit pouvoir se
  # lancer — or PHPUnit ecrit, composer ecrit, Pint ecrit.
  #
  # D'ou ce service, qui monte le meme repertoire en ecriture et ne demarre
  # jamais tout seul : le profil `tools` le tient hors de `docker compose up`.
  # Il ne sert que de `docker compose run`.
  #
  #   docker compose run --rm dme composer install   # une fois, pour les
  #                                                  # dependances de dev
  #   docker compose run --rm dme ./vendor/bin/phpunit
  #   docker compose run --rm dme ./vendor/bin/pint
  #
  # `user: "0:0"` : composer et PHPUnit creent des repertoires dans `vendor/`,
  # ce que l'utilisateur `www-data` de l'image ne peut pas faire sur un montage
  # venant de l'hote.
  dme:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: keneya-wf-mod-app
    profiles: ["tools"]
    user: "0:0"
    working_dir: /var/www/keneya-dme_mod
    environment:
      COMPOSER_ALLOW_SUPERUSER: 1
    volumes:
      - ../keneya-dme_mod:/var/www/keneya-dme_mod
    networks:
      - keneya

  db:
    image: mariadb:11.4
    restart: unless-stopped
    ports:
      # Publie pour les sauvegardes et les outils d'administration.
      - "${DB_PUBLISHED_PORT:-3309}:3306"
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-keneya_wf_mod}"
      MARIADB_USER: "${DB_USERNAME:-keneya}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-keneya}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      # Volume dedie : c'est lui que l'on sauvegarde (voir README).
      - keneya_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - keneya

volumes:
  keneya_db:
    name: keneya_wf_mod_db
  keneya_storage:
    name: keneya_wf_mod_storage

networks:
  keneya:
    driver: bridge
