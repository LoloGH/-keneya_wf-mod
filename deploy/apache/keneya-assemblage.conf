# Hote virtuel Apache pour l'assemblage, derriere lequel tourne la pile Docker.
#
# Gabarit : remplacez `keneya.sukaxess.com` par votre sous-domaine, deposez ce
# fichier dans /etc/apache2/sites-available/, puis :
#
#     sudo a2enmod proxy proxy_http headers
#     sudo a2ensite keneya-assemblage
#     sudo apache2ctl configtest && sudo systemctl reload apache2
#     sudo certbot --apache -d keneya.sukaxess.com
#
# Certbot ajoute alors un second fichier `-le-ssl.conf` porteur du certificat,
# qu'il renouvellera tout seul. Ne recopiez pas les directives SSL ici : elles
# lui appartiennent, et les dupliquer casse le renouvellement.
#
# ---------------------------------------------------------------------------
# Ce que ce fichier suppose, et qui doit etre vrai avant
# ---------------------------------------------------------------------------
#
#   1. Le sous-domaine pointe deja sur ce serveur. Certbot verifie la
#      correspondance en interrogeant le domaine depuis l'exterieur : tant que
#      le DNS n'a pas propage, il refuse d'emettre, et le message d'erreur
#      parle de validation plutot que de DNS.
#
#   2. La pile ecoute sur la boucle locale. `docker-compose.yml` publie sur
#      `${APP_HTTP_BIND:-127.0.0.1}` : c'est ce qui empeche qu'on joigne
#      l'application en clair a cote du domaine chiffre, et qu'on lui envoie
#      un faux `X-Forwarded-Proto` depuis l'exterieur.
#
#   3. Le `.env` de la pile porte l'adresse publique :
#
#          APP_URL=https://keneya.sukaxess.com
#          SESSION_SECURE_COOKIE=true
#
#      Sans `APP_URL`, les liens des courriels et des SMS partent vers
#      `localhost`. Sans le second, le cookie de session voyage sans sa marque
#      « chiffre seulement ».

<VirtualHost *:80>
    ServerName keneya.sukaxess.com

    # Laisse a certbot le soin d'installer la redirection vers HTTPS : il la
    # pose lui-meme et sait la maintenir. En attendant, le site repond en
    # clair, ce qui permet justement la validation du certificat.
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8083/
    ProxyPassReverse / http://127.0.0.1:8083/

    # Sans cet en-tete, Laravel ne sait pas que la requete est arrivee
    # chiffree : il fabrique des URL en `http://` dans une page servie en
    # `https://`, et le navigateur bloque la feuille de style, les images et
    # les appels Livewire. La page s'affiche cassee sans que rien n'en dise la
    # cause. `bootstrap/app.php` declare les plages privees comme proxys de
    # confiance, faute de quoi cet en-tete serait ignore.
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS

    # Le plafond applicatif des pieces jointes est de 10 Mo ; la regle vaut
    # partout dans la chaine : proxy >= serveur web >= post_max_size >=
    # upload_max_filesize > plafond applicatif. Sans cela, un depot de fichier
    # echoue au premier maillon trop etroit, sans message clair.
    LimitRequestBody 16777216

    ErrorLog  ${APACHE_LOG_DIR}/keneya-assemblage-error.log
    CustomLog ${APACHE_LOG_DIR}/keneya-assemblage-access.log combined
</VirtualHost>
