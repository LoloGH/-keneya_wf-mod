name: CI

# Chaque push et chaque pull request : c'est la premiere validation
# automatique du projet, et elle doit se declencher sans qu'on y pense.
on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (MariaDB 11.4)
    runs-on: ubuntu-latest

    services:
      # MariaDB, pas SQLite. La suite de ce projet n'avait jamais ete validee
      # contre le moteur reellement utilise en production, et les deux ne se
      # comportent pas pareil : SQLite accepte sans broncher une valeur hors
      # enum que MariaDB tronque et refuse. Meme version que le service `db`
      # de docker-compose.yml, pour que la CI teste ce qui tourne a l'hopital.
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: keneya_workflow_test
          MARIADB_USER: keneya
          MARIADB_PASSWORD: keneya
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      # phpunit.xml fait desormais autorite sur l'environnement du processus
      # (voir tests/bootstrap.php : sous Docker, `env_file` dirigeait la suite
      # vers la base de travail de la pile). Ce drapeau est la porte de sortie
      # prevue, et il faut la demander : il laisse passer les variables DB_*
      # ci-dessous, pour que la meme suite soit validee contre le moteur
      # reellement utilise a l'hopital.
      KENEYA_TEST_DB_FROM_ENV: '1'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: keneya_workflow_test
      DB_USERNAME: keneya
      DB_PASSWORD: keneya

    steps:
      # Un seul `checkout` depuis la v3.4.2. Le module DME etait un second
      # depot, clone a cote de celui-ci et sur une branche nommee a la main :
      # une CI verte ne prouvait donc pas que les deux moities avancaient
      # ensemble, seulement qu'elles s'entendaient a l'instant du clone.
      # Il vit desormais sous `modules/dme` et arrive avec le reste.
      - uses: actions/checkout@v4

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          # Memes extensions que docker/php/Dockerfile.
          #
          # PHP 8.4 et non 8.3 : le composer.lock committe verrouille
          # symfony/clock v8.1, qui exige php >= 8.4.1. Le premier passage de
          # cette CI l'a montre en echouant des `composer install` — le lock
          # avait ete produit sur PHP 8.4 sans que rien ne le signale. C'est
          # aussi la version du serveur de production (voir php8.4-fpm dans
          # docs/exploitation-demo.md).
          php-version: '8.4'
          # `gd` n'est declaree par aucun composer.json — dompdf ne le fait
          # pas — mais son absence fait echouer en 500 tout rendu PDF portant
          # un logo, une signature ou un tampon, ainsi que le QR code des
          # documents du module DME.
          extensions: bcmath, gd, intl, pcntl, pdo_mysql, zip, mbstring
          coverage: none
          tools: composer:v2

      - name: Cache des dependances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparer l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Attendre MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 --silent; then
              echo "MariaDB repond."
              exit 0
            fi
            sleep 2
          done
          echo "MariaDB n'a pas repondu dans le delai imparti." >&2
          exit 1

      - name: Migrations sur la base de service
        run: php artisan migrate --force

      - name: php artisan test
        run: php artisan test

      # Apres les tests : un oubli de formatage ne doit pas masquer un vrai
      # echec fonctionnel dans le journal. `--test` verifie sans corriger, pour
      # que la CI signale l'ecart sans reecrire le code dans le dos de l'auteur.
      - name: Style de code (Pint)
        run: vendor/bin/pint --test

  # La suite propre du module, qui n'a jamais tourne en CI : elle vivait dans
  # un autre depot, avec son propre outillage, et personne ne la declenchait.
  # Le module etant desormais ici, la raison a disparu.
  #
  # Elle dit autre chose que celle de l'hote. Celle-ci traverse le module,
  # mais toujours avec WorkFlow derriere ; la sienne le verifie **seul**, sans
  # hote pour lui fournir un utilisateur, des roles ou une signature. Un
  # cablage manquant passe la premiere et echoue la seconde.
  #
  # Aucun service de base : le module tourne sous Testbench, en SQLite en
  # memoire (`DB_CONNECTION=testing` dans son phpunit.xml).
  module:
    name: Suite du module DME
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: modules/dme

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          extensions: bcmath, gd, intl, pcntl, pdo_mysql, zip, mbstring
          coverage: none
          tools: composer:v2

      - name: Cache des dependances Composer
        uses: actions/cache@v4
        with:
          path: modules/dme/vendor
          key: composer-dme-${{ runner.os }}-php8.4-${{ hashFiles('modules/dme/composer.lock') }}
          restore-keys: composer-dme-${{ runner.os }}-php8.4-

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: phpunit
        run: ./vendor/bin/phpunit

      # Le module garde son propre style — il porte `declare(strict_types=1)`
      # et des conventions qui lui sont propres. `pint.json` l'exclut du
      # formateur de l'hote, et c'est le sien qui le verifie ici : reformater
      # 114 fichiers pour aligner deux presets aurait detruit son `git blame`
      # pour un gain nul.
      - name: Style de code (Pint du module)
        run: ./vendor/bin/pint --test
